edition = "2024";

package com.google.protobuf.test;

import "google/protobuf/java_features.proto";

option java_outer_classname = "GeneratedMessageParserTestProto";

message TestMapParsing {
  option features.(pb.java).nest_in_file_class = NO;

  int32 value = 1;
  TestMapParsing child = 2;
  oneof choice {
    TestMapParsing selected = 3;
  }
  map<string, TestMapParsing> children = 4;
  string text = 5;
}

message TestExtensionParsing {
  option features.(pb.java).nest_in_file_class = NO;

  int32 value = 1;
  TestExtensionParsing child = 2;
  oneof choice {
    TestExtensionParsing selected = 3;
    bytes text = 4;
    TestExtensionParsing other = 5;
  }
  TestExtensionParsing group = 6 [features.message_encoding = DELIMITED];
  repeated int32 values = 7;
  map<string, int32> entries = 8;

  extensions 100 to max;
}

extend TestExtensionParsing {
  int32 number = 100;
  TestExtensionParsing extension_child = 101;
}
