edition = "2024";

package com.google.protobuf.test;

import "google/protobuf/java_features.proto";

option java_outer_classname = "ColdInitializationTestProto";

message ColdLeft {
  option features.(pb.java).nest_in_file_class = NO;

  int32 value = 1;
  ColdRight child = 2;
  oneof choice {
    ColdRight selected = 3;
  }
  map<string, ColdRight> children = 4;
  string text = 5;
}

message ColdRight {
  option features.(pb.java).nest_in_file_class = NO;

  int32 value = 1;
  ColdLeft child = 2;
  oneof choice {
    ColdLeft selected = 3;
  }
  map<string, ColdLeft> children = 4;
  string text = 5;
}
