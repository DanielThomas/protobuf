syntax = "proto2";
package builder_probe;
option java_multiple_files = true;

message Leaf {
  optional int32 value = 1;
  repeated int32 values = 2;
}
message RepeatedChoices {
  oneof choice {
    Leaf first = 1;
    Leaf second = 2;
    int32 value = 3;
  }
}
message Envelope {
  oneof choice {
    RepeatedChoices child = 1;
    int32 value = 2;
  }
}
message Ordinary { optional RepeatedChoices child = 1; }
message Recursive {
  oneof choice {
    Recursive child = 1;
    RepeatedChoices leaf = 2;
    int32 value = 3;
  }
}
message ScalarChoice {
  oneof choice {
    int32 value = 1;
    bytes data = 2;
  }
}
message Multi {
  oneof left {
    RepeatedChoices first = 1;
    int32 x = 2;
  }
  oneof right {
    RepeatedChoices second = 3;
    int32 y = 4;
  }
  repeated int32 values = 5;
}
message MutualA {
  oneof choice {
    MutualB child = 1;
    RepeatedChoices leaf = 2;
    int32 value = 3;
  }
}
message MutualB {
  oneof choice {
    MutualA child = 1;
    int32 value = 2;
  }
}
